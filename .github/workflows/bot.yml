name: Crypto Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run alert bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: python bot.py

      - name: Save bot state
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts.json state.json telegram_offset.txt
          git diff --cached --quiet || git commit -m "Update bot state"
          git push
